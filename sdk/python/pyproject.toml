[project]
name = "scrapy-client"
version = "0.1.0"
description = "scrapy live-config client: env bootstrap + WebSocket runtime updates"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "websockets>=12.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
